name: Build APK

on:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: app-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: painel-da-vida-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app-android/app/build/outputs/apk/debug/app-debug.apk painel-da-vida.apk
          gh release delete apk-latest --cleanup-tag -y || true
          gh release create apk-latest painel-da-vida.apk --title "Painel da Vida (APK)" --notes "APK mais recente do Painel da Vida, com widgets de agenda e anotações."
